services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isntustdown}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isntustdown}
      POSTGRES_DB: ${POSTGRES_DB:-isntustdown}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isntustdown} -d ${POSTGRES_DB:-isntustdown}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # The app applies migrations on boot, so it must not start before
    # Postgres is actually accepting connections.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose supplies the real environment; the binary must not also read
      # the mounted .env, or a stale file could silently win.
      DATABASE_URL: ${DATABASE_URL:-postgres://isntustdown:isntustdown@postgres:5432/isntustdown?sslmode=disable}
    command: ["-env", ""]
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
